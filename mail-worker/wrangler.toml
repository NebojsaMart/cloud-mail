name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#D1 binding name, do not change
#database_name = ""		#D1 database name
#database_id = ""		#D1 database id

#[[kv_namespaces]]
#binding = "kv"			#KV binding name, do not change
#id = ""					#KV namespace id

#[[r2_buckets]]
#binding = "r2"			#R2 binding name, do not change
#bucket_name = ""		#R2 bucket name

#[[send_email]]
#name = "email"			#Cloudflare email sending, preferred when configured

[ai]
binding = "ai"

[assets]
binding = "assets"		#Static assets binding name, do not change
directory = "./dist"	#Build output of the Vue frontend, default dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#Runs hourly; resetDaySendCount only takes effect at 00:00 UTC


[vars]
#ai_model = ""			#AI model, defaults to @cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#Enable analytics data caching
#orm_log = false			#Enable SQL logging
#domain = []				#Email domains, multiple allowed. Example: ["example1.com","example2.com"]
#admin = ""					#Admin email	Example: admin@example.com
#jwt_secret = ""			#JWT secret, any random string

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
